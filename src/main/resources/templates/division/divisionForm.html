<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <title th:text="${titulo}">Formulario de División</title>
</head>
<body>
    <nav th:replace="~{fragments/fragment :: menu}"></nav>

    <main class="container mt-5">
        <section>
            <h1 th:text="${titulo}">Título Dinámico</h1>
            <p>Completa los campos para agregar una nueva división.</p>
            <hr>
            
            <div class="card shadow-sm mt-4">
                <div class="card-body">
                    <form th:action="@{/consola/divisiones/save}" 
                          method="post" th:object="${division}">

                        <input type="hidden" th:field="*{id}">

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="clave" class="form-label">Clave</label>
                                <input type="text" id="clave" th:field="*{clave}" 
                                       class="form-control" placeholder="Ej. DIV01" required>
                            </div>

                            <div class="col-md-8 mb-3">
                                <label for="nombre" class="form-label">Nombre de la División</label>
                                <input type="text" id="nombre" th:field="*{nombre}" 
                                       class="form-control" placeholder="Nombre completo de la división" required>
                            </div>
                        </div>

                        <div class="mb-3 form-check form-switch">
                            <input class="form-check-input" type="checkbox" role="switch" 
                                   id="activo" th:field="*{activo}">
                            <label class="form-check-label" for="activo">¿División Activa?</label>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary">
                                Guardar Datos
                            </button>
                            <a th:href="@{/consola/divisiones}" class="btn btn-secondary">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/divisiones.js}"></script>
</body>
</html>
