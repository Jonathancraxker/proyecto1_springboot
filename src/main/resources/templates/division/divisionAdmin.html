<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <title>Administración de Divisiones</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <nav th:replace="~{fragments/fragment :: menu}"></nav>

    <main class="container mt-5">
        <section>
            <h1>Gestión de Divisiones</h1>
            <p>Sección administrativa para el control de divisiones académicas.</p>
            
                <div class="table-responsive shadow-sm rounded">
                    <div class="d-flex justify-content-end">
                        <button
                            sec:authorize="hasAnyRole('ADMIN', 'CORDINADOR')"
                            onclick="abrirModalDivision()"
                            type="button" 
                            class="btn btn-outline-secondary ms-2 mb-3"
                            >
                            Agregar
                            </button>
                        <a sec:authorize="hasAnyRole('ADMIN', 'CORDINADOR')" 
                            th:href="@{/consola/divisiones/add}" class="btn btn-outline-success ms-2 mb-3" title="Agregar">
                            <i class="bi bi-plus-circle me-1"></i> Agregar División
                        </a>
                    </div>
                    
                    <div class="table-responsive shadow-sm rounded">
                        <table class="table table-hover align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th style="width: 15%;">ID</th>
                                    <th>Nombre - División</th>
                                    <th class="text-center">Clave</th>
                                    <th class="text-center">Activa</th>
                                    <th class="text-center" style="width: 20%;">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:id="'row-' + ${division.id}" th:each="division : ${divisiones}">
                                    <td th:text="${division.id}" class="fw-bold"></td>
                                    <td th:text="${division.nombre}"></td>
                                    <td class="text-center" th:text="${division.clave}"></td>
                                    <td class="text-center">
                                        <span th:if="${division.activo}" class="badge bg-success">Sí</span>
                                        <span th:if="${!division.activo}" class="badge bg-danger">No</span>
                                    </td>
                                    
                                    <td class="text-center">
                                        <div class="btn-group" role="group">
                                            <a sec:authorize="hasAnyRole('ADMIN', 'CORDINADOR', 'EDITOR')" 
                                            class="btn btn-outline-warning ms-2"
                                            th:onclick="abrirModalDivision([[${division.id}]])"
                                            title="Editar">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <a sec:authorize="hasAnyRole('ADMIN', 'CORDINADOR')" 
                                                th:href="@{/consola/divisiones/delete/{id}(id=${division.id})}" 
                                            class="btn btn-outline-danger ms-2" 
                                            onclick="return confirm('¿Estás seguro de eliminar esta división?')" 
                                            title="Eliminar">
                                                <i class="bi bi-trash"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
        </section>
    </main>

    <!-- Modal -->
    <div sec:authorize="hasAnyRole('ADMIN', 'CORDINADOR', 'EDITOR')" class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="divisonForm" class="needs-validation" novalidate>
<div class="mb-3">
<input type='hidden' id='id' name='id'>
</div>
<div class="mb-3">
<label for="clave" class="form-label">Clave de la División</label>
<input type="text" class="form-control" id="clave" name="clave" placeholder="Ingrese la clave de la división" required>
<div class="invalid-feedback">Por favor ingrese la clave.</div>
</div>
<div class="mb-3">
<label for="nombre" class="form-label">Nombre de la División</label>
<input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ingrese el nombre de la división" required>
<div class="invalid-feedback">Por favor ingrese el nombre.</div>
</div>
<div class="mb-3">
<label for="activo" class="form-label">
<input type="checkbox" id="activo" name="activo" value="true">
Activa
</label>
</div>
<div id="alertaError" class="alert alert-danger d-none" role="alert"></div>
<div class="modal-footer">
<button type="submit" class="btn btn-primary" onclick="guardarDivision(event)">Guardar</button>
<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
</div>
</form>
                </div>
            </div>
        </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script th:src="@{/js/divisiones.js}"></script>
</body>
</html>
