<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Document</title>
</head>
<body>
    <nav th:replace="fragments/fragment :: menu"></nav>

    <main class="container mt-5">
        <section>
            <h1>Oferta Educativa</h1>
            <p>Esta es la sección de oferta educativa de la página web.</p>
            
                    <div class="row">
                        <div class="col-12 col-md-6 mb-4" th:each="oferta : ${ofertas}">
                            <div class="card h-100 shadow-sm">
                                <div class="card-body">
                                    <span class="badge bg-secondary" th:text="${oferta.id}">id</span>
                                    <h3 class="card-title mt-2" th:text="${oferta.nombreOferta}"></h3>
                                    <p class="card-text text-muted" th:text="${oferta.modalidad}"></p>
                                    <img th:src="@{{img}(img=${oferta.imagen})}" alt="Imagen de la oferta educativa" class="img-fluid rounded shadow-sm"/>
                                    <p class="text-primary" style="cursor: pointer;" onclick="window.location.href='/oferta-educativa-detalle/${oferta.id}'">Conocer más</p>
                                    <!-- <p>Perfil de egreso:</p>
                                    <p th:text="${oferta.perfilEgreso.descripcion}">Descripción del perfil de egreso</p>
                                    <ul>
                                        <p><strong>Habilidades Transversales:</strong></p>
                                        <li th:each="habilidad : ${oferta.perfilEgreso.habilidadesTransversales}" th:text="${habilidad}"></li>
                                        <p class="mt-3"><strong>Habilidades Específicas:</strong></p> 
                                        <li th:each="competencia : ${oferta.perfilEgreso.competenciasEspecificas}" th:text="${competencia}"></li>
                                    </ul> -->
                                </div>
                            </div>
                        </div>
                    </div>
        </section>
    </main>
    
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
</body>
</html>
