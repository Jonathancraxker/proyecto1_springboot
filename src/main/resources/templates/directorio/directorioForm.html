<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <title>Formulario de Directorio</title>
</head>
<body>
    <nav th:replace="~{fragments/fragment :: menu}"></nav>

    <main class="container mt-5">
        <section>
            <h1>Agregar Persona</h1>
            <p>Completa los campos para agregar una nueva persona al directorio institucional.</p>
            <hr>
            
            <div class="card shadow-sm mt-4">
                <div class="card-body">
                    <form th:action="@{/consola/directorio/save}" 
                        method="post" th:object="${persona}">

                        <input type="hidden" th:field="*{id}">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text" id="nombre" th:field="*{nombre}" 
                                    class="form-control" placeholder="Ingresa tu nombre" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="cargo" class="form-label">Cargo</label>
                                <input type="text" id="cargo" th:field="*{cargo}" 
                                    class="form-control" placeholder="Ingresa tu cargo" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="correo" class="form-label">Correo Electrónico</label>
                                <input type="email" id="correo" th:field="*{correo}" 
                                    class="form-control" placeholder="Ingresa tu correo electrónico" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="extension" class="form-label">Extensión</label>
                                <input type="number" id="extension" th:field="*{extension}" 
                                    class="form-control" placeholder="Ingresa tu extensión" required>
                            </div>

                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary">
                                Guardar Datos
                            </button>
                            <a th:href="@{/consola/directorio}" class="btn btn-secondary">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/directorio.js}"></script>
</body>
</html>
