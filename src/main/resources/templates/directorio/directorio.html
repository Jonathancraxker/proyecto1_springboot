<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directorio | UTEQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    <nav th:replace="~{fragments/fragment :: menu}"></nav>

    <main class="container my-5 d-flex justify-content-center">
        <div class="shadow-sm bg-white w-100 border rounded overflow-hidden" style="max-width: 900px;">
            
            <div class="d-flex justify-content-between align-items-center px-4 py-2 text-white" style="background-color: #2c3e66;">
                <h4 class="mb-0 fw-bold">Directorio UTEQ</h4>
                <span class="small">Tel (442) 209 61 00 al 04</span>
            </div>

            <div th:each="p, iterStat : ${personas}" 
                 th:classappend="${iterStat.odd} ? 'bg-light' : 'bg-white'" 
                 class="px-4 py-3 border-bottom">
                
                <div class="d-flex align-items-center mb-1 fw-bold fs-5 text-dark">
                    <i class="bi bi-person me-2 text-center" style="width: 20px;"></i>
                    <span th:text="${p.nombre}">Nombre de la Persona</span>
                </div>
                
                <div class="d-flex align-items-center mb-1 text-secondary">
                    <i class="bi bi-briefcase me-2 text-center" style="width: 20px;"></i>
                    <span th:text="${p.cargo}">Cargo</span>
                </div>
                
                <div class="d-flex align-items-center mb-1 text-secondary">
                    <i class="bi bi-envelope me-2 text-center" style="width: 20px;"></i>
                    <span th:text="${p.correo}">correo@uteq.edu.mx</span>
                </div>
                
                <div class="d-flex align-items-center text-secondary">
                    <i class="bi bi-telephone me-2 text-center" style="width: 20px;"></i>
                    <span>Extensión <span th:text="${p.extension}">0000</span></span>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(personas)}" class="p-4 text-center text-muted">
                No hay registros en el directorio.
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
