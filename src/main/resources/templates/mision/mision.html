<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Identidad Institucional</title>
</head>
<body class="bg-light">
    <nav th:replace="~{fragments/fragment :: menu}"></nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-10" th:each="m : ${misionActiva}">
                
                <div class="card mb-4 border shadow overflow-hidden">
                    <div class="row g-0">
                        <div class="col-md-3 bg-dark text-white d-flex align-items-center justify-content-center p-4">
                            <h2 class="mb-0 fw-bold">Misión</h2>
                        </div>
                        <div class="col-md-9 bg-white p-4">
                            <p class="lead text-dark" th:text="${m.mision}"></p>
                            <!-- <hr class="my-2 opacity-25">
                            <div class="text-muted small">
                                <strong th:text="${m.fecha}"></strong>
                            </div> -->
                        </div>
                    </div>
                </div>

                <div class="card mb-4 border shadow overflow-hidden">
                    <div class="row g-0">
                        <div class="col-md-3 bg-secondary text-white d-flex align-items-center justify-content-center p-4">
                            <h2 class="mb-0 fw-bold">Visión</h2>
                        </div>
                        <div class="col-md-9 bg-white p-4">
                            <p class="lead text-dark" th:text="${m.vision}"></p>
                        </div>
                    </div>
                </div>

                <div class="card mb-4 border shadow overflow-hidden">
                    <div class="row g-0">
                        <div class="col-md-3 bg-white text-white d-flex align-items-center justify-content-center p-4">
                            <h2 class="mb-0 fw-bold text-dark">Política</h2>
                        </div>
                        <div class="col-md-9 bg-white p-4">
                            <p class="lead text-dark" th:text="${m.politica}"></p>
                            <!-- <hr class="my-2 opacity-25">
                            <div class="text-muted small">
                                <strong>DIR-F-13</strong> | Rev: 04 | Fecha: 29-abr-2026
                            </div> -->
                        </div>
                    </div>
                </div>

                <div class="card mb-4 border shadow overflow-hidden">
                    <div class="row g-0">
                        <div class="col-md-3 bg-secondary text-white d-flex align-items-center justify-content-center p-4">
                            <h2 class="mb-0 fw-bold">Objetivos</h2>
                        </div>
                        <div class="col-md-9 bg-white p-4">
                            <div class="text-dark" style="white-space: pre-line;" th:text="${m.objetivos}"></div>
                            <!-- <hr class="my-2 opacity-25">
                            <div class="text-muted small">
                                <strong>DIR-F-07</strong> | Rev: 04 | Fecha: 29-nov-2026
                            </div> -->
                        </div>
                    </div>
                </div>

                <div class="card mb-4 border shadow overflow-hidden">
                    <div class="row g-0">
                        <div class="col-md-3 bg-dark text-white d-flex align-items-center justify-content-center p-4">
                            <h2 class="mb-0 fw-bold">Valores</h2>
                        </div>
                        <div class="col-md-9 bg-white p-4">
                            <div class="text-dark" style="white-space: pre-line;" th:text="${m.valores}"></div>
                            <!-- <hr class="my-2 opacity-25">
                            <div class="text-muted small">
                                <strong>DIR-F-08</strong> | Rev: 04 | Fecha: 29-nov-2026
                            </div> -->
                        </div>
                    </div>
                </div>

            </div>
        </div>
        <div class="text-center py-5" th:if="${misionActiva == null}">
            <h3 class="text-muted">Información institucional en mantenimiento.</h3>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
