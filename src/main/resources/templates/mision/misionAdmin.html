<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Administración de Misión y Visión</title>
</head>
<body>
    <nav th:replace="~{fragments/fragment :: menu}"></nav>

    <main class="container mt-5">
        <section>
            <h1>Gestión Institucional</h1>
            <p>Sección para el control de Misión, Visión, Política, Objetivos y Valores.</p>
            
            <div class="d-flex justify-content-end mb-3">
                <button sec:authorize="hasAnyRole('ADMIN')" onclick="abrirModalMision()" type="button" class="btn btn-outline-secondary ms-2">
                    <i class="bi bi-plus-circle"></i> Agregar
                </button>
                <a sec:authorize="hasAnyRole('ADMIN')" th:href="@{/consola/misiones/add}" class="btn btn-outline-success ms-2">
                    <i class="bi bi-plus-circle"></i> Agregar por Formulario
                </a>
            </div>

            <div class="table-responsive shadow-sm rounded">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Misión</th>
                            <th>Visión</th>
                            <th>Política</th>
                            <th>Objetivos</th>
                            <th>Valores</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:id="'row-' + ${m.id}" th:each="m : ${misiones}">
                            <td th:text="${m.id}" class="fw-bold"></td>
                            <td th:text="${#strings.abbreviate(m.mision, 50)}"></td>
                            <td th:text="${#strings.abbreviate(m.vision, 50)}"></td>
                            <td th:text="${#strings.abbreviate(m.politica, 50)}"></td>
                            <td th:text="${#strings.abbreviate(m.objetivos, 50)}"></td>
                            <td th:text="${#strings.abbreviate(m.valores, 50)}"></td>
                            <td th:text="${m.fecha}"></td>
                            <td>
                                <span th:class="${m.activo} ? 'badge bg-success' : 'badge bg-secondary'"
                                    th:text="${m.activo} ? 'Activo' : 'Inactivo'">
                                </span>
                            </td>
                            <td class="text-center">
                                <div class="btn-group">
                                    <button sec:authorize="hasAnyRole('ADMIN', 'RECTOR', 'EDITOR')" class="btn btn-outline-warning" th:onclick="abrirModalMision([[${m.id}]])">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <a sec:authorize="hasRole('ADMIN')" th:href="@{/consola/misiones/delete/{id}(id=${m.id})}" 
                                       class="btn btn-outline-danger" 
                                       onclick="return confirm('¿Eliminar este registro?')">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div sec:authorize="hasAnyRole('ADMIN', 'RECTOR', 'EDITOR')" class="modal fade" id="misionModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="misionModalLabel">Misión y Visión</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="misionForm" class="needs-validation" novalidate>
                        <input type="hidden" id="id" name="id">
                        <div class="mb-3">
                            <label class="form-label">Misión</label>
                            <textarea class="form-control" id="mision" name="mision" rows="2" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Visión</label>
                            <textarea class="form-control" id="vision" name="vision" rows="2" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Política</label>
                            <textarea class="form-control" id="politica" name="politica" rows="2" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Objetivos</label>
                            <textarea class="form-control" id="objetivos" name="objetivos" rows="2" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Valores</label>
                            <textarea class="form-control" id="valores" name="valores" rows="2" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Fecha</label>
                            <input type="date" class="form-control" id="fecha" name="fecha" required>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="activo" name="activo" value="true">
                            <label class="form-check-label" for="activo">Activo</label>
                        </div>
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-primary" onclick="guardarMision(event)">Guardar</button>
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/misiones.js}"></script>
</body>
</html>
