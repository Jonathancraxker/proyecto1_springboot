<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Recuperación de Contraseña</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
    <!-- <nav th:replace="~{fragments/fragment :: menu}"></nav> -->

    <div class="main-container">
        <div class="card shadow login-card">
            <div class="card-body">
                <h2 class="text-center mb-4 fw-bold text-secondary">Recuperar cuenta</h2>
                
                <p class="text-center text-muted small mb-4">Ingresa tu correo para recuperar tu contraseña.</p>

                <form method="POST" th:action="@{/email/enviar}" th:object="${emailDTO}">
                    
                    <div class="mb-3">
                        <input type="text" class="form-control" th:field="*{destinatario}" id="destinatario" placeholder="Para" required>
                    </div>

                    <div class="mb-3">
                        <input type="text" class="form-control" th:field="*{asunto}" id="asunto" placeholder="Asunto" required>
                    </div>

                    <div class="mb-4">
                        <textarea class="form-control" th:field="*{mensaje}" id="mensaje" placeholder="Contenido" style="height: 100px" required></textarea>
                    </div>

                    <div class="d-grid">
                        <button class="btn btn-primary btn-lg" type="submit">Enviar</button>
                    </div>
                </form>

                <div class="mb-3 mt-2 text-center">
                    <p><a href="/login" class=" text-decoration-none">Iniciar sesión</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
