<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" &gt>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {font-family: "Segoe UI", sans-serif; background-color: #f4f4f4; padding: 20px; text-align: center; margin: 0;}
      .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); text-align: center; display: inline-block; margin: 0 auto;}
      .header {color: #4a90e2; border-bottom: 2px solid #b9c7d6; padding-bottom: 10px; }
      .footer { margin-top: 20px; font-size: 12px; color: #888;}
    </style>
  </head>
  <body>
      <div class="card shadow">
        <!-- <h1 class="header">¡Hola, <span th:text="${nombre}">Asunto</span>!</h1> -->
        <!-- <p th:text="${mensaje}">Bienvenido a nuestra plataforma.</p>  -->
        <h1 class="header">¡Hola!</h1>
        <p>Alguien está intentando restablecer la contraseña de tu cuenta.</p>
        <p style="font-weight: bold;">Si eres tú, tu código de verificación es: </p>
        <strong th:text="${codigo}">0000</strong></p>
        <div class="footer">
          Este es un correo automático, por favor no respondas.
        </div>
      </div>
  </body>
</html>
